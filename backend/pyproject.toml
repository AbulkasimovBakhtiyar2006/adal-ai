[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adal-ai-backend"
version = "0.1.0"
description = "RU/KK document assistant with mandatory evidence verification"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "google-auth[requests]>=2.38,<3",
  "snowballstemmer>=3,<4",
  "python-multipart>=0.0.20,<1",
  "beautifulsoup4>=4.13,<5",
  "lxml>=5,<7",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "av>=14,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
